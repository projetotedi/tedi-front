name: CI

on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn

      - name: Contrato OpenAPI × tedi-back (develop)
        # Só avisa (::warning:: + resumo do job), nunca falha o build. Ver docs/ARCHITECTURE.md §5.
        continue-on-error: true
        timeout-minutes: 2
        run: node scripts/check-openapi-drift.mjs

      - run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Format check
        run: yarn format:check

      - name: Typecheck
        run: yarn typecheck

      - name: Fronteiras entre módulos
        run: yarn depcruise

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build
