name: Docker

# Só confere que a imagem de produção (nginx) continua construindo. Roda em push para main
# (e manualmente), não em PR: o deploy é pelo Vercel, a imagem não é usada em PR e gastava minutos da cota.
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - nginx.conf
      - package.json
      - yarn.lock
      - src/**
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: tedi-front:${{ github.ref_name }}
